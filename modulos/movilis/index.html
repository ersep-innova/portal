<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="Movilis · Propuesta institucional ERSeP." name="description"/><title>Movilis · Portal de Innovación y Análisis de Datos</title><link href="../../assets/css/style.css" rel="stylesheet"/><link href="../../assets/css/portal-pages.css" rel="stylesheet"/><link href="../../assets/css/standalone.css" rel="stylesheet"/><link href="../../assets/img/favicon.ico" rel="icon"/>
<style>
.movilis-stage{position:relative;background:#0b1220;border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);}
.movilis-stage img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:contain;background:#0b1220;}
.movilis-nav{position:absolute;top:0;bottom:0;width:15%;min-width:52px;border:0;cursor:pointer;background:transparent;color:#fff;font-size:30px;display:grid;place-items:center;transition:background .2s ease;-webkit-tap-highlight-color:transparent;}
.movilis-nav:hover{background:rgba(0,0,0,.28);}
.movilis-nav.prev{left:0;}.movilis-nav.next{right:0;}
.movilis-nav:disabled{opacity:.25;cursor:default;background:transparent;}
.movilis-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;}
.movilis-counter{font:800 13px var(--font-main);color:var(--text-muted);letter-spacing:.4px;}
.movilis-btns{display:flex;gap:8px;flex-wrap:wrap;}
.movilis-btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:9px 14px;font:700 13px var(--font-main);cursor:pointer;transition:.18s ease;}
.movilis-btn:hover{border-color:var(--accent-mid);color:var(--accent-mid);}
.movilis-thumbs{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:thin;}
.movilis-thumbs img{height:60px;width:auto;border-radius:6px;border:2px solid transparent;cursor:pointer;opacity:.55;transition:.18s ease;flex-shrink:0;}
.movilis-thumbs img:hover{opacity:.85;}
.movilis-thumbs img.active{opacity:1;border-color:var(--accent-mid);}
.movilis-stage.fs{position:fixed;inset:0;z-index:9999;border-radius:0;border:0;display:grid;place-items:center;}
.movilis-stage.fs img{max-height:100vh;width:auto;max-width:100vw;aspect-ratio:auto;}
</style></head>
<body class="tool-page"><div class="wrap">
<header class="header"><div class="header-left"><h1>Movilis</h1><span class="header-badge">Portal de Innovación y Análisis de Datos · Propuesta institucional</span></div><div class="header-right"><a class="nav-chip" href="../../"><span>⌂</span> Menú</a><button class="theme-toggle" data-theme-toggle="" type="button">🌙</button></div></header>
<section class="tool-hero"><div><div class="tool-kicker">Propuesta institucional</div><h2>ERSeP · Movilis</h2><p>Aplicación de gestión de actas como mecanismo de transición operativa. Recorré la presentación con las flechas o el teclado.</p></div><div class="hero-symbol">📑</div></section>
<section class="card"><div class="card-body">
<div class="movilis-stage" id="stage">
<button aria-label="Anterior" class="movilis-nav prev" id="prev">‹</button>
<img alt="Diapositiva 1" id="slide" src="slides/slide-01.jpg"/>
<button aria-label="Siguiente" class="movilis-nav next" id="next">›</button>
</div>
<div class="movilis-toolbar">
<span class="movilis-counter" id="counter">1 / 28</span>
<div class="movilis-btns">
<button class="movilis-btn" id="fs">⛶ Pantalla completa</button>
</div>
</div>
<div class="movilis-thumbs" id="thumbs"></div>
</div></section>
</div>
<script defer="" src="../../assets/js/theme.js"></script>
<script>
(function(){
  var TOTAL=28,i=0;
  var pad=function(n){return String(n).padStart(2,'0');};
  var src=function(n){return 'slides/slide-'+pad(n+1)+'.jpg';};
  var slide=document.getElementById('slide'),counter=document.getElementById('counter'),
      prev=document.getElementById('prev'),next=document.getElementById('next'),
      stage=document.getElementById('stage'),thumbs=document.getElementById('thumbs'),fs=document.getElementById('fs');
  // preload thumbnails
  for(var t=0;t<TOTAL;t++){(function(t){var im=new Image();im.src=src(t);im.alt='Diapositiva '+(t+1);im.dataset.idx=t;im.addEventListener('click',function(){go(t);});thumbs.appendChild(im);})(t);}
  function render(){
    slide.src=src(i);slide.alt='Diapositiva '+(i+1);
    counter.textContent=(i+1)+' / '+TOTAL;
    prev.disabled=(i===0);next.disabled=(i===TOTAL-1);
    Array.prototype.forEach.call(thumbs.children,function(im,idx){im.classList.toggle('active',idx===i);});
    var act=thumbs.children[i];if(act)act.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  }
  function go(n){i=Math.max(0,Math.min(TOTAL-1,n));render();}
  prev.addEventListener('click',function(){go(i-1);});
  next.addEventListener('click',function(){go(i+1);});
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowRight'||e.key==='PageDown'){go(i+1);}
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(i-1);}
    else if(e.key==='Escape'&&stage.classList.contains('fs')){toggleFs();}
  });
  function toggleFs(){stage.classList.toggle('fs');fs.textContent=stage.classList.contains('fs')?'✕ Salir':'⛶ Pantalla completa';}
  fs.addEventListener('click',toggleFs);
  render();
})();
</script>
</body></html>
