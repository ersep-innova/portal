  <script>
   document.addEventListener("DOMContentLoaded", () => {
    const entryScreen = document.getElementById("portal_entry_screen");
    const portalScreen = document.getElementById("portal_main_screen");
    const accessButton = document.getElementById("portal_entry_button");
    const loadingPanel = document.getElementById("portal_entry_loading");
    const loadingStatus = document.getElementById("portal_entry_loading_status");
    const progress = document.getElementById("portal_entry_progress");
    const progressBar = document.getElementById("portal_entry_progress_bar");

    if (!entryScreen || !portalScreen || !accessButton || !loadingPanel || !loadingStatus || !progress || !progressBar) {
     portalScreen?.removeAttribute("hidden");
     return;
    }

    const entryState = window.PortalEntry || { mostrar: true, marcarVista: () => {} };

    const mostrarPortalDirecto = () => {
     entryScreen.hidden = true;
     portalScreen.hidden = false;
     document.documentElement.classList.remove("portal-entry-enabled");
     document.documentElement.classList.add("portal-entry-skip");
    };

    // Si la portada ya se vio en esta sesión, se entra directo a las tarjetas.
    if (!entryState.mostrar) {
     mostrarPortalDirecto();
     return;
    }

    // Al volver desde una herramienta con el botón "atrás" (bfcache), no se repite la portada.
    window.addEventListener("pageshow", (event) => {
     if (event.persisted && entryState.yaVista && entryState.yaVista() && !entryScreen.hidden) {
      mostrarPortalDirecto();
     }
    });

    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const stages = reduceMotion
     ? [
       { delay: 40, value: 100, text: "El portal está listo." }
      ]
     : [
       { delay: 80, value: 18, text: "Organizando las herramientas institucionales…" },
       { delay: 650, value: 46, text: "Preparando los accesos del portal…" },
       { delay: 1250, value: 73, text: "Aplicando la identidad visual del ERSeP…" },
       { delay: 1850, value: 92, text: "Verificando que todo esté listo…" },
       { delay: 2250, value: 100, text: "El portal está listo." }
      ];

    const openPortal = () => {
     entryState.marcarVista();
     if (/(^|[?&])intro=1(&|$)/.test(window.location.search) || window.location.hash === "#intro") {
      try { window.history.replaceState(null, "", window.location.pathname); } catch (e) {}
     }
     entryScreen.classList.add("is-leaving");
     const leaveDelay = reduceMotion ? 40 : 480;

     window.setTimeout(() => {
      entryScreen.hidden = true;
      portalScreen.hidden = false;
      portalScreen.classList.add("portal-main-enter");
      window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
      const portalTitle = portalScreen.querySelector("h1");
      if (portalTitle) {
       portalTitle.setAttribute("tabindex", "-1");
       portalTitle.focus({ preventScroll: true });
      }
     }, leaveDelay);
    };

    accessButton.addEventListener("click", () => {
     accessButton.disabled = true;
     accessButton.setAttribute("aria-busy", "true");
     loadingPanel.hidden = false;

     stages.forEach((stage, index) => {
      window.setTimeout(() => {
       progressBar.style.width = `${stage.value}%`;
       progress.setAttribute("aria-valuenow", String(stage.value));
       loadingStatus.textContent = stage.text;

       if (index === stages.length - 1) {
        window.setTimeout(openPortal, reduceMotion ? 80 : 360);
       }
      }, stage.delay);
     });
    }, { once: true });
   });
  </script>
 </body>
</html>
