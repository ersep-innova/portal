<!DOCTYPE html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <meta content="Portal de Innovaci&oacute;n y An&aacute;lisis de Datos del ERSeP." name="description"/>
  <title>
   Portal de Innovaci&oacute;n y An&aacute;lisis de Datos &middot; ERSeP
  </title>
  <link href="assets/css/style.css" rel="stylesheet"/>
  <link href="assets/css/standalone.css" rel="stylesheet"/>
  <link href="assets/css/institutional-theme.css" rel="stylesheet"/>
  <link href="assets/img/favicon.ico" rel="icon"/>
  <script>
   /* ── Portada de acceso: se muestra sólo la primera vez ──
      PORTAL_ENTRY_SCOPE = "session" → vuelve a mostrarse al abrir el portal en una pestaña nueva.
      PORTAL_ENTRY_SCOPE = "device"  → se muestra una sola vez por navegador.
      Forzar la portada en cualquier momento: agregar ?intro=1 o #intro a la URL. */
   (function () {
    var PORTAL_ENTRY_SCOPE = "session";
    var KEY = "ersep.portal.entryVista";
    var memoria = false;

    function almacen() {
     try {
      return PORTAL_ENTRY_SCOPE === "device" ? window.localStorage : window.sessionStorage;
     } catch (e) { return null; }
    }
    function yaVista() {
     var s = almacen();
     if (!s) return memoria;
     try { return s.getItem(KEY) === "1"; } catch (e) { return memoria; }
    }
    function marcarVista() {
     memoria = true;
     var s = almacen();
     if (!s) return;
     try { s.setItem(KEY, "1"); } catch (e) {}
    }
    function forzarPortada() {
     return /(^|[?&])intro=1(&|$)/.test(window.location.search) || window.location.hash === "#intro";
    }

    var mostrar = forzarPortada() || !yaVista();
    document.documentElement.classList.add(mostrar ? "portal-entry-enabled" : "portal-entry-skip");

    window.PortalEntry = { mostrar: mostrar, yaVista: yaVista, marcarVista: marcarVista };
   })();
  </script>
  <style>
   .portal-entry-screen {
    display: none;
   }

   .portal-entry-screen[hidden] {
    display: none !important;
   }

   .portal-entry-enabled .portal-entry-screen {
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 6px 1fr auto;
    background:
     radial-gradient(circle at 83% 14%, rgba(56, 189, 248, .18), transparent 28%),
     radial-gradient(circle at 10% 92%, rgba(244, 185, 66, .16), transparent 25%),
     linear-gradient(145deg, var(--bg, #f4f4f4) 0%, var(--card, #fff) 48%, var(--bg-subtle, #eee) 100%);
    color: var(--text, #141414);
    overflow: hidden;
    position: relative;
   }

   .portal-entry-enabled #portal_main_screen[hidden] {
    display: none !important;
   }

   /* Acceso directo a las tarjetas: sin parpadeo de la portada */
   .portal-entry-skip #portal_entry_screen {
    display: none !important;
   }

   .portal-entry-skip #portal_main_screen[hidden] {
    display: block !important;
   }

   .portal-entry-screen::before,
   .portal-entry-screen::after {
    content: "";
    position: fixed;
    border-radius: 999px;
    pointer-events: none;
    filter: blur(1px);
    opacity: .7;
   }

   .portal-entry-screen::before {
    width: min(34rem, 72vw);
    height: min(34rem, 72vw);
    right: -14rem;
    top: 12vh;
    border: 1px solid color-mix(in srgb, var(--portal-cyan, #38bdf8) 35%, transparent);
    box-shadow:
     0 0 0 4rem color-mix(in srgb, var(--portal-blue, #0f4c8a) 6%, transparent),
     0 0 0 8rem color-mix(in srgb, var(--portal-gold, #f4b942) 5%, transparent);
   }

   .portal-entry-screen::after {
    width: 15rem;
    height: 15rem;
    left: -8rem;
    bottom: -5rem;
    background: color-mix(in srgb, var(--accent-mid, #ce0202) 8%, transparent);
   }

   .portal-entry-topbar {
    min-height: 88px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.05rem clamp(1.1rem, 4vw, 4rem);
    background: color-mix(in srgb, var(--card, #fff) 88%, transparent);
    border-bottom: 1px solid var(--border, #ddd);
    backdrop-filter: blur(16px);
    position: relative;
    z-index: 3;
   }

   .portal-entry-brand {
    display: flex;
    align-items: center;
    gap: .9rem;
    min-width: 0;
   }

   .portal-entry-brand img {
    display: block;
    width: auto;
    height: 46px;
    max-width: min(220px, 42vw);
    object-fit: contain;
   }

   .portal-entry-brand-copy {
    display: grid;
    gap: .12rem;
   }

   .portal-entry-brand-copy strong {
    font-size: .96rem;
    line-height: 1.2;
   }

   .portal-entry-brand-copy span {
    color: var(--text-muted, #5f6368);
    font-size: .75rem;
   }

   .portal-entry-tab {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 36px;
    padding: .45rem .9rem;
    border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--accent-mid, #ce0202) 30%, var(--border, #ddd));
    background: var(--accent-soft, #fff0f0);
    color: var(--accent, #8f0000);
    font-weight: 800;
    font-size: .78rem;
    letter-spacing: .08em;
    text-transform: uppercase;
   }

   .portal-entry-service-bar {
    position: relative;
    z-index: 3;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
   }

   .portal-entry-service-bar span:nth-child(1) { background: #159bd3; }
   .portal-entry-service-bar span:nth-child(2) { background: #f5a623; }
   .portal-entry-service-bar span:nth-child(3) { background: #e53935; }
   .portal-entry-service-bar span:nth-child(4) { background: #7cb342; }
   .portal-entry-service-bar span:nth-child(5) { background: #6a4c93; }
   .portal-entry-service-bar span:nth-child(6) { background: #00897b; }

   .portal-entry-main {
    width: min(1180px, calc(100% - 2rem));
    margin: 0 auto;
    padding: clamp(2.4rem, 7vh, 6.5rem) 0;
    display: grid;
    grid-template-columns: minmax(0, 1.18fr) minmax(310px, .82fr);
    align-items: center;
    gap: clamp(2rem, 7vw, 6rem);
    position: relative;
    z-index: 2;
   }

   .portal-entry-copy {
    max-width: 740px;
   }

   .portal-entry-kicker {
    display: inline-flex;
    align-items: center;
    gap: .55rem;
    margin-bottom: 1.1rem;
    color: var(--accent, #8f0000);
    font-size: .78rem;
    font-weight: 900;
    letter-spacing: .14em;
    text-transform: uppercase;
   }

   .portal-entry-kicker::before {
    content: "";
    width: 2.2rem;
    height: 3px;
    border-radius: 99px;
    background: var(--accent-mid, #ce0202);
   }

   .portal-entry-copy h1 {
    max-width: 830px;
    margin: 0;
    font-size: clamp(2.35rem, 5.8vw, 5.55rem);
    line-height: .96;
    letter-spacing: -.055em;
    text-wrap: balance;
   }

   .portal-entry-copy h1 span {
    color: var(--accent-mid, #ce0202);
   }

   .portal-entry-copy > p {
    max-width: 660px;
    margin: 1.45rem 0 0;
    color: var(--text-muted, #5f6368);
    font-size: clamp(1rem, 1.6vw, 1.18rem);
    line-height: 1.75;
   }

   .portal-entry-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 1rem;
    margin-top: 2rem;
   }

   .portal-entry-button {
    min-height: 58px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: .75rem;
    padding: .85rem 1.35rem;
    border: 0;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent, #8f0000), var(--accent-mid, #ce0202));
    color: #fff;
    font: inherit;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 18px 38px color-mix(in srgb, var(--accent-mid, #ce0202) 24%, transparent);
    transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
   }

   .portal-entry-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 22px 46px color-mix(in srgb, var(--accent-mid, #ce0202) 30%, transparent);
   }

   .portal-entry-button:focus-visible {
    outline: 3px solid color-mix(in srgb, var(--portal-cyan, #38bdf8) 70%, #fff);
    outline-offset: 4px;
   }

   .portal-entry-button:disabled {
    cursor: wait;
    opacity: .78;
    transform: none;
   }

   .portal-entry-button-arrow {
    font-size: 1.15rem;
    transition: transform .2s ease;
   }

   .portal-entry-button:hover .portal-entry-button-arrow {
    transform: translateX(4px);
   }

   .portal-entry-caption {
    color: var(--text-faint, #858585);
    font-size: .83rem;
   }

   .portal-entry-visual {
    min-height: 440px;
    display: grid;
    place-items: center;
    position: relative;
   }

   .portal-entry-orbit {
    width: min(410px, 82vw);
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px solid color-mix(in srgb, var(--portal-blue, #0f4c8a) 24%, transparent);
    background:
     radial-gradient(circle, color-mix(in srgb, var(--card, #fff) 96%, transparent) 0 29%, transparent 30%),
     conic-gradient(from 24deg, rgba(21,155,211,.22), rgba(245,166,35,.16), rgba(229,57,53,.18), rgba(124,179,66,.18), rgba(106,76,147,.16), rgba(0,137,123,.18), rgba(21,155,211,.22));
    box-shadow: var(--shadow-lg, 0 24px 70px rgba(15,23,42,.18));
    position: relative;
    animation: portal-entry-float 5.5s ease-in-out infinite;
   }

   .portal-entry-orbit::before,
   .portal-entry-orbit::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    border: 1px dashed color-mix(in srgb, var(--text-muted, #5f6368) 22%, transparent);
   }

   .portal-entry-orbit::before { inset: 9%; }
   .portal-entry-orbit::after { inset: 22%; }

   .portal-entry-logo-card {
    width: 46%;
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    padding: 1.4rem;
    border-radius: 28%;
    background: color-mix(in srgb, var(--card, #fff) 93%, transparent);
    border: 1px solid var(--border, #ddd);
    box-shadow: var(--shadow-md, 0 10px 28px rgba(25,25,25,.09));
    position: relative;
    z-index: 2;
   }

   .portal-entry-logo-card img {
    width: 100%;
    height: auto;
    display: block;
   }

   .portal-entry-node {
    width: 14px;
    height: 14px;
    position: absolute;
    border-radius: 50%;
    background: var(--node-color);
    box-shadow: 0 0 0 8px color-mix(in srgb, var(--node-color) 16%, transparent);
   }

   .portal-entry-node.n1 { --node-color: #159bd3; left: 8%; top: 27%; }
   .portal-entry-node.n2 { --node-color: #f5a623; right: 12%; top: 19%; }
   .portal-entry-node.n3 { --node-color: #e53935; right: 5%; bottom: 28%; }
   .portal-entry-node.n4 { --node-color: #7cb342; left: 20%; bottom: 8%; }
   .portal-entry-node.n5 { --node-color: #6a4c93; left: 2%; bottom: 42%; }

   .portal-entry-loading {
    max-width: 610px;
    margin-top: 1.7rem;
    padding: 1.05rem 1.1rem;
    border: 1px solid var(--border, #ddd);
    border-radius: 16px;
    background: color-mix(in srgb, var(--card, #fff) 90%, transparent);
    box-shadow: var(--shadow-sm, 0 2px 8px rgba(25,25,25,.06));
   }

   .portal-entry-loading[hidden] {
    display: none !important;
   }

   .portal-entry-loading-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: .75rem;
   }

   .portal-entry-loading-head strong {
    font-size: .92rem;
   }

   .portal-entry-loading-status {
    color: var(--text-muted, #5f6368);
    font-size: .8rem;
    text-align: right;
   }

   .portal-entry-progress {
    height: 9px;
    overflow: hidden;
    border-radius: 999px;
    background: var(--bg-subtle, #eee);
   }

   .portal-entry-progress-bar {
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #159bd3, #7cb342, #f5a623, #e53935);
    box-shadow: 0 0 18px rgba(21, 155, 211, .35);
    transition: width .65s cubic-bezier(.2,.75,.25,1);
   }

   .portal-entry-loading-dots {
    display: flex;
    gap: .38rem;
    margin-top: .75rem;
   }

   .portal-entry-loading-dots span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent-mid, #ce0202);
    animation: portal-entry-pulse 1.1s ease-in-out infinite;
   }

   .portal-entry-loading-dots span:nth-child(2) { animation-delay: .14s; }
   .portal-entry-loading-dots span:nth-child(3) { animation-delay: .28s; }

   .portal-entry-footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .65rem;
    padding: 1.1rem;
    color: var(--text-muted, #5f6368);
    font-size: .78rem;
    position: relative;
    z-index: 2;
   }

   .portal-entry-footer img {
    width: auto;
    height: 25px;
    object-fit: contain;
   }

   .portal-entry-screen.is-leaving {
    animation: portal-entry-leave .48s ease forwards;
   }

   #portal_main_screen.portal-main-enter {
    animation: portal-main-enter .58s ease both;
   }

   @keyframes portal-entry-float {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-12px) rotate(1deg); }
   }

   @keyframes portal-entry-pulse {
    0%, 100% { transform: translateY(0); opacity: .35; }
    50% { transform: translateY(-4px); opacity: 1; }
   }

   @keyframes portal-entry-leave {
    to { opacity: 0; transform: scale(.985); }
   }

   @keyframes portal-main-enter {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
   }

   @media (max-width: 860px) {
    .portal-entry-main {
     grid-template-columns: 1fr;
     padding-top: 2.7rem;
     text-align: center;
    }

    .portal-entry-copy {
     margin: 0 auto;
    }

    .portal-entry-kicker,
    .portal-entry-actions {
     justify-content: center;
    }

    .portal-entry-copy > p {
     margin-left: auto;
     margin-right: auto;
    }

    .portal-entry-visual {
     min-height: 330px;
    }

    .portal-entry-orbit {
     width: min(330px, 78vw);
    }
   }

   @media (max-width: 580px) {
    .portal-entry-topbar {
     min-height: 76px;
     padding: .85rem 1rem;
    }

    .portal-entry-brand-copy {
     display: none;
    }

    .portal-entry-tab {
     min-height: 32px;
     padding: .35rem .7rem;
     font-size: .68rem;
    }

    .portal-entry-main {
     width: min(100% - 1.4rem, 1180px);
     gap: 2.1rem;
     padding: 2.15rem 0 2.7rem;
    }

    .portal-entry-copy h1 {
     font-size: clamp(2.15rem, 12vw, 3.3rem);
    }

    .portal-entry-button {
     width: 100%;
     min-height: 62px;
    }

    .portal-entry-caption {
     width: 100%;
    }

    .portal-entry-visual {
     min-height: 260px;
    }

    .portal-entry-orbit {
     width: min(255px, 73vw);
    }

    .portal-entry-loading-head {
     align-items: flex-start;
     flex-direction: column;
     gap: .25rem;
    }

    .portal-entry-loading-status {
     text-align: left;
    }
   }

   @media (prefers-reduced-motion: reduce) {
    .portal-entry-orbit,
    .portal-entry-loading-dots span,
    .portal-entry-screen.is-leaving,
    #portal_main_screen.portal-main-enter {
     animation: none !important;
    }

    .portal-entry-progress-bar {
     transition-duration: .08s;
    }
   }

   /* ═══════ Estado de las tarjetas: "Disponible" bien diferenciado ═══════ */
   .tool-grid a.tool-card:not(.soon-card) .menu-card-badge:not(.future),
   .tool-grid a.tool-card:not(.soon-card) .menu-card-badge:not(.private):not(.future) {
    background: var(--area-color);
    color: #fff;
    border: 1px solid var(--area-color);
    box-shadow: 0 3px 10px color-mix(in srgb, var(--area-color) 32%, transparent);
   }

   .tool-grid a.tool-card .menu-card-badge:not(.future)::before {
    background: #fff;
    box-shadow: 0 0 0 0 rgba(255, 255, 255, .75);
    animation: badgePulse 2.4s ease-out infinite;
   }

   @keyframes badgePulse {
    0%   { box-shadow: 0 0 0 0 rgba(255, 255, 255, .75); }
    70%  { box-shadow: 0 0 0 6px rgba(255, 255, 255, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
   }

   /* "Próximamente" queda claramente en segundo plano */
   .tool-grid .tool-card .menu-card-badge.future {
    background: transparent;
    color: var(--text-faint);
    border: 1px dashed color-mix(in srgb, var(--text-faint) 55%, transparent);
    box-shadow: none;
   }

   .tool-grid .tool-card .menu-card-badge.future::before {
    background: color-mix(in srgb, var(--text-faint) 70%, transparent);
    animation: none;
    box-shadow: none;
   }

   .tool-grid .future-module-card {
    opacity: .82;
   }

   /* ═══════ Borde giratorio (sentido horario) con los colores institucionales ═══════ */
   @property --giro {
    syntax: "<angle>";
    initial-value: 0deg;
    inherits: false;
   }

   .tool-grid a.tool-card:not(.soon-card) {
    border: 2px solid transparent;
    border-top: 2px solid transparent;
    padding-top: 26px;
    background:
     linear-gradient(var(--card), var(--card)) padding-box,
     conic-gradient(from var(--giro),
      var(--ersep-water), var(--ersep-energy), var(--ersep-transport),
      var(--ersep-safety), var(--ersep-road), var(--ersep-antennas),
      var(--ersep-red), var(--ersep-water)) border-box;
    animation: giroHorario 8s linear infinite;
   }

   .tool-grid a.tool-card:not(.soon-card):hover {
    border-color: transparent;
    border-top-color: transparent;
    animation-duration: 2.6s;
   }

   @keyframes giroHorario {
    to { --giro: 360deg; }
   }

   /* Tarjetas que son enlace pero todavía no están disponibles */
   .tool-grid a.tool-card.soon-card {
    opacity: .88;
   }

   @media (prefers-reduced-motion: reduce) {
    .tool-grid a.tool-card:not(.soon-card) { animation: none; }
    .tool-grid a.tool-card .menu-card-badge:not(.future)::before { animation: none; }
   }

   /* ═══════ Franja "Quiénes somos" sobre la grilla ═══════ */
   .about-strip {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
    padding: 14px 18px;
    border: 1px solid var(--border);
    border-left: 4px solid var(--ersep-red);
    border-radius: 14px;
    background: var(--card);
    box-shadow: 0 6px 18px rgba(31, 38, 43, .06);
    text-decoration: none;
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
   }

   .about-strip:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 30px rgba(31, 38, 43, .11);
    border-color: color-mix(in srgb, var(--ersep-red) 40%, var(--border));
    border-left-color: var(--ersep-red);
   }

   .about-logo {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 58px;
    height: 46px;
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
   }

   .about-logo img { width: 100%; height: auto; display: block; }

   .about-copy { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
   .about-copy strong { font: 800 15px var(--font-main); color: var(--text); }
   .about-copy small { font: 400 12.5px var(--font-main); color: var(--text-muted); line-height: 1.5; }

   .about-btn {
    flex: 0 0 auto;
    margin-left: auto;
    padding: 10px 16px;
    border-radius: 10px;
    background: var(--ersep-red);
    color: #fff;
    font: 800 12.5px var(--font-main);
    letter-spacing: .3px;
    white-space: nowrap;
   }

   .about-strip:hover .about-btn { background: var(--ersep-red-dark); }

   @media (max-width: 700px) {
    .about-strip { flex-wrap: wrap; gap: 12px; }
    .about-copy { flex: 1 1 100%; order: 2; }
    .about-btn { margin-left: 0; order: 3; flex: 1 1 100%; text-align: center; }
   }

   /* El "Disponible" del Boletín en rojo institucional: el gris no se distingue */
   .tool-grid a.tool-card.area-regulation:not(.soon-card) .menu-card-badge:not(.private):not(.future) {
    background: var(--ersep-red);
    border-color: var(--ersep-red);
    box-shadow: 0 3px 10px color-mix(in srgb, var(--ersep-red) 32%, transparent);
   }
  </style>
 </head>
 <body>
  <section aria-labelledby="portal_entry_title" class="portal-entry-screen" id="portal_entry_screen">
   <header class="portal-entry-topbar">
    <div class="portal-entry-brand">
     <img alt="ERSeP · Ente Regulador de los Servicios Públicos" src="assets/img/institucional/logo-ersep.png"/>
     <span class="portal-entry-brand-copy">
